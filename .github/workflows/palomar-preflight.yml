name: Palomar preflight

# Runs Palomar's own mechanical verifier on this exact commit, once per submitted
# challenge workspace. Advisory only: it runs neither review nor registration.
# The verifier fetches the source anonymously from GitHub, so this works only on
# a public repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        include:
          # PARAM: one line per submitted workspace; `id` is exactly 12 lowercase letters/digits.
          - { workspace: main-theorem, id: maintheorem1 }
          - { workspace: classical-compactness, id: classicalcmp }
          - { workspace: sigma-h, id: sigmahentry1 }
          - { workspace: lipschitz-q, id: lipschitzq01 }
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@65f0154ed776cd26c224254aa57b379137f28b0d
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 65f0154ed776cd26c224254aa57b379137f28b0d
      request_id: ${{ matrix.id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"project_path":"challenges/${{ matrix.workspace }}",
        "comparator_config_path":"challenges/${{ matrix.workspace }}/config.json",
        "formalization_metadata_path":"challenges/${{ matrix.workspace }}/formalization.yaml",
        "authorization_relationship":"I am a responsible author or maintainer"}
