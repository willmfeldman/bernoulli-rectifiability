# Entry metadata for the `sigma-h` workspace (format: mathlib-initiative formalization.yaml v0.4).
# The root formalization.yaml keeps its own schema for the repository's checkers.
# Keep comments outside block scalars (`>-`); anything inside one becomes public text.

version: v0.4

project:
  name: "Minkowski and Hausdorff bounds, rectifiability and frequency one on the set of highest density of a non-minimizing Bernoulli free boundary"
  description: >-
    A Lean 4 formalization of Theorem 7.2 of Kriventsov and Weiss on the
    set Σ^H of points of highest density of a variational solution (u,
    χ) of the one-phase Bernoulli free boundary problem (a critical
    point of the Alt–Caffarelli energy ∫(|∇u|² + χ) with respect to
    domain variations), in every dimension n ≥ 2. The first main result
    states that for every bound N₊ there is a constant C = C(N₊, n) such
    that, for every variational solution on a neighbourhood of the
    closed unit ball with frequency N_0(u; 1) ≤ N₊, if 0 ∈ Σ^H_t then
    the s-neighbourhoods of Σ^H_t ∩ B_{1/100} have volume at most C s
    for t ≤ s ≤ 1, and, when 0 ∈ Σ^H, Σ^H ∩ B_{1/100} has
    ℋ^{n-1}-measure at most C and is countably ℋ^{n-1}-rectifiable. The
    proof is the Naber–Valtorta covering argument with the discrete and
    rectifiable Reifenberg theorems. The second main result states that
    the frequency N_x(u; r) tends to 1 as r → 0+ at ℋ^{n-1}-almost every
    point of Σ^H. Every notion, including the variational-solution
    property, the Weiss energy, the frequency and Σ^H, is written out
    from Mathlib definitions.
  authors: ["William M. Feldman"]
  responsible_maintainers: ["William M. Feldman"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.AP"]
  msc2020: ["35R35", "49Q20", "28A75"]

sources:
  - title: "Rectifiability, finite Hausdorff measure, and compactness for non-minimizing Bernoulli free boundaries"
    authors: ["Dennis Kriventsov", "Georg S. Weiss"]
    type: paper
    id: "doi:10.1002/cpa.22226"
    location: "Theorem 7.2 (1)–(3) (arXiv:2306.10131v2)"
    relationship: formalizes
    note: >-
      Formalizes Theorem 7.2 (1)–(3) of arXiv version 2, in every
      dimension n ≥ 2, with the paper's quantifier order (for every N₊
      there is C for all solutions). In (1)–(2) the solution is
      assumed on an open set containing the closed unit ball, since
      the hypothesis N_0(u; 1) ≤ N₊ involves the values of u on the
      unit sphere; the differences are listed under fidelity.

related_formalizations: []

automation:
  methods:
