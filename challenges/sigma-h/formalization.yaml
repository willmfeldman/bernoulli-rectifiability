      models: ["Claude Opus", "Claude Sonnet"]
      framework: "Claude Code"
  notes: >-
    The Lean proofs were written by AI coding agents (Claude, by Anthropic)
    under the author's mathematical direction and review. The theorem
    statements, definitions and proof routes were reviewed by the author;
    correctness rests on Lean's kernel check and the comparator challenges.

review:
  status: "author-verified"
  notes: >-
    The author reviewed the definitions and the statements of the compared
    theorems against Kriventsov–Weiss, including every difference from the
    printed statements recorded under fidelity, and the proof route against
    the paper. The proofs are checked by Lean's kernel and by the comparator
    challenges in the repository.

fidelity:
  divergences: >-
    In (1)–(2) the solution is assumed on an open set Ω containing the
    closed unit ball, not only on B₁, while Σ^H and Σ^H_t are still
    taken relative to B₁: the hypothesis N_0(u; 1) ≤ N₊ involves ∫_{∂B₁}
    u², which a solution on the open ball does not constrain, and with
    independently prescribed boundary values the printed bound fails (u
    = |Re z^k| in B₁ ⊆ ℝ², χ ≡ 1, with large constant boundary values).
    B_{1/100}(x) is read as B_{1/100}, centred at 0. The neighbourhood
    bound (1) is stated for t ≤ s ≤ 1 rather than for all s ≥ t (for
    large s the volume grows like sⁿ). The case t = 0 is stated with
    Σ^H, and there the neighbourhood bound is claimed for all 0 < s ≤ 1.
    The frequency is set to 0 where H_x(u; r) = 0 (the paper uses −∞);
    this does not affect the statements, since H_x(u; r) > 0 at points
    of Σ^H and N₊ is arbitrary. Sphere integrals are taken against the
    normalized Hausdorff measure ℋ^{n-1}.

