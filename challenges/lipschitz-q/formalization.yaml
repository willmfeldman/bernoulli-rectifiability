review:
  status: "author-verified"
  notes: >-
    The author reviewed the definitions and the statements of the compared
    theorems against Kriventsov–Weiss, including every difference from the
    printed statements recorded under fidelity, and the proof route against
    the paper. The proofs are checked by Lean's kernel and by the comparator
    challenges in the repository.

fidelity:
  divergences: >-
    The paper states these results for the constant coefficient Q ≡ 1
    only; here Q is Lipschitz on Ω with 0 < c ≤ Q ≤ C', and the bounds
    and the constant C_V are universally quantified. The
    domain-variation identity carries the term D(Q²)(x)ξ(x)χ(x), with Q²
    differentiable almost everywhere (Rademacher). Σ^H is defined with
    the coefficient frozen at the point; since M^{Q(x)}_x(u; r) is only
    almost monotone for non-constant Q, its limit exists in [−∞, ∞) and
    the constant-coefficient characterization "M_x(u; r) ≥ |B₁| for
    every r" is not available. The density characterization uses the
    relative free boundary of {y ∈ Ω : u(y) > 0}. The blow-up statements
    are made along a sequence r_k → 0+ along which the rescalings u(x +
    r_k ·)/r_k converge locally uniformly; the limit is a solution for
    the constant coefficient Q(x) with the same C_V, and χ(x + r_k ·)
    converges in L¹ on compact sets along a further subsequence. The
    identification of χ is stated for a connected set on which (u, χ) is
    a solution near every point, with Q bounded and Lipschitz on each
    neighbourhood, and it adds χ = 1 almost everywhere when u ≡ 0. The
    rectifiability and Hausdorff-measure bounds, the identification of
    the Laplacian measure and the compactness of classical solutions are
    not part of this entry.

