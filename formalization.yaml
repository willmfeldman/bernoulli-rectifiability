# Theorem manifest for InnerVariational (and the standalone Sperner library), modeled on the
# theorem-manifest conventions used by public Lean formalization repositories. CI
# (scripts/check-formalization-manifest.rb) checks that every listed Lean name resolves, that each
# target depends on exactly axioms.expected, and that the challenge inventory below matches
# challenges/*/config.json; CI also elaborates the external challenge workspaces. Statement
# equality between challenges and solutions is checked only by the release comparator workflow.
schema_version: "1"
project:
  name: "InnerVariational"
  title: >-
    Rectifiability, finite Hausdorff measure, and compactness for non-minimizing Bernoulli free
    boundaries, in Lean
  authors:
    - "William M. Feldman"
  repository: "https://github.com/willmfeldman/bernoulli-rectifiability"
  license: "Apache-2.0"
  language: "Lean"
  theorem_prover: "Lean 4"
  lean_toolchain: "leanprover/lean4:v4.34.1"
  mathlib: "v4.34.1"
  dependencies:
    - name: "gmt-foundations"
      repository: "https://github.com/willmfeldman/gmt-foundations"
      version: "v0.2.0"
      commit: "b913189f34b55cd0f6a1758507a7521a782bef3b"
    - name: "elliptic-bernoulli-foundations"
      repository: "https://github.com/willmfeldman/elliptic-bernoulli-foundations"
      version: "v0.2.0"
      commit: "36923fa81e96f972db82d5cfc80b3f037be59ad6"

source:
  reference: >-
    D. Kriventsov and G. S. Weiss, Rectifiability, finite Hausdorff measure, and compactness for
    non-minimizing Bernoulli free boundaries, Comm. Pure Appl. Math. 78 (2025), no. 3,
    DOI 10.1002/cpa.22226; arXiv:2306.10131. Theorem numbers refer to arXiv version 2.

build:
  package_file: "lakefile.toml"
  manifest_file: "lake-manifest.json"
  root_import: "InnerVariational"
  libraries:
    - "InnerVariational"
    - "Sperner"
  commands:
    - "lake exe cache get"
    - "lake build"

axioms:
  expected:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

automation:
  methods:
    - method: "agent-assisted formalization"
      models:
        - "Claude (Anthropic)"
      framework: "Claude Code agentic coding workflow"
      review_status: "human-supervised"
      notes: >-
        The Lean proofs were written by AI coding agents (Claude, by Anthropic) under the author's
        mathematical direction and review. The theorem statements and proof routes were reviewed
        by the author. Correctness rests on Lean's kernel check, together with the comparator
        challenges in challenges/.

# Headline theorems. `lean_name` is the hypothesis-discharged library theorem; `challenge_theorem`
# is the matching theorem of the standalone challenge workspace, whose Statement.lean restates
# the claim in Mathlib vocabulary only. Targets of kind `sanity-check` are certified by their
# challenge workspace alone and have no library `lean_name`.
targets:
  - id: "main-theorem"
    title: "Structure of the free boundary of a variational solution (Theorem 1.2)"
    kind: "headline-theorem"
    lean_name: "InnerVariational.Statements.main_theorem"
    lean_file: "InnerVariational/Statements/Main.lean"
    challenge: "challenges/main-theorem"
    challenge_theorem: "challenge_main_theorem"
    source: "Kriventsov–Weiss, Theorem 1.2 (i)–(iv)."
    statement: >-
      Let n ≥ 2 and let (u, χ) be a variational solution of the Bernoulli problem on a domain
      Ω ⊆ ℝⁿ. Then (i) either u ≡ 0 on Ω or χ = χ_{u>0} a.e. on Ω; (ii) Ω ∩ ∂{u>0} is countably
      ℋ^{n-1}-rectifiable and has locally finite ℋ^{n-1}-measure; (iii)
      Δu = ℋ^{n-1}⌊∂*{u>0} + 2α(n)√(H_x(u;0+)) ℋ^{n-1}⌊Σ^H in Ω, in the sense of distributions;
      (iv) at ℋ^{n-1}-a.e. point of Ω ∩ ∂{u>0} outside the reduced boundary, the normalized
      energy ratio tends to 1 and u is asymptotically √(H_x(u;r)) α(n) |(y − x)·ν| for a unit
      vector ν. Differences from the printed statement: (iii) uses the body's set Σ^H and
      unaveraged H (the introduction writes Σ_** and an averaged H); the second display of
      (iv) includes the factor √(H_x(u;r)) that Lemma 8.5 (1) carries.

  - id: "chi-identification"
    title: "Identification of χ (Theorem 8.6)"
    kind: "headline-theorem"
    lean_name: "InnerVariational.Statements.chi_eq_indicator"
    lean_file: "InnerVariational/Statements/Main.lean"
    challenge: "challenges/main-theorem"
    challenge_theorem: "challenge_chi_eq_indicator"
    source: "Kriventsov–Weiss, Theorem 8.6."
    statement: >-
      Let n ≥ 2 and let (u, χ) be a variational solution on an open connected Ω ⊆ ℝⁿ. Then either
      u ≡ 0 on Ω or χ = χ_{u>0} almost everywhere on Ω.

  - id: "laplacian-measure"
    title: "The Laplacian measure of a variational solution (Theorem 8.7)"
    kind: "headline-theorem"
    lean_name: "InnerVariational.Statements.laplacian_measure_eq"
    lean_file: "InnerVariational/Statements/Main.lean"
    challenge: "challenges/main-theorem"
    challenge_theorem: "challenge_laplacian_measure_eq"
    source: "Kriventsov–Weiss, Theorem 8.7."
    statement: >-
      Let n ≥ 2 and let (u, χ) be a variational solution on an open Ω ⊆ ℝⁿ. Then Ω ∩ ∂{u>0} is
      countably ℋ^{n-1}-rectifiable with locally finite ℋ^{n-1}-measure, and
      Δu = ℋ^{n-1}⌊∂*{u>0} + 2α(n)√(H_x(u;0+)) ℋ^{n-1}⌊Σ^H in Ω, in the sense of distributions,
      with a locally finite right-hand side.

  - id: "sigma-h"
    title: "Minkowski and Hausdorff bounds and rectifiability of Σ^H (Theorem 7.2 (1)–(2))"
    kind: "headline-theorem"
    lean_name: "InnerVariational.Statements.sigmaH_main"
    lean_file: "InnerVariational/Statements/Main.lean"
    challenge: "challenges/sigma-h"
    challenge_theorem: "challenge_sigmaH_main"
    source: "Kriventsov–Weiss, Theorem 7.2 (1)–(2)."
    statement: >-
      For every n ≥ 2 and N₊ there is C = C(n, N₊) such that for every variational solution
      (u, χ) on an open set containing the closed unit ball with frequency N_0(u; 1) ≤ N₊:
      if 0 ∈ Σ^H_t with t > 0, then |B_s(Σ^H_t ∩ B_{1/100})| ≤ C s for t ≤ s ≤ 1; and if
      0 ∈ Σ^H, then |B_s(Σ^H ∩ B_{1/100})| ≤ C s for 0 < s ≤ 1,
      ℋ^{n-1}(Σ^H ∩ B_{1/100}) ≤ C, and Σ^H ∩ B_{1/100} is countably ℋ^{n-1}-rectifiable.
      Differences from the printed statement: the solution is assumed on an open set containing
      the closed unit ball (the frequency bound reads u on ∂B₁); the ball B_{1/100}(x) is read
      as B_{1/100}; the neighbourhood bound is stated for s ≤ 1.

  - id: "sigma-h-frequency"
    title: "Frequency one on Σ^H (Theorem 7.2 (3))"
    kind: "headline-theorem"
    lean_name: "InnerVariational.Statements.sigmaH_main_frequency"
    lean_file: "InnerVariational/Statements/Main.lean"
    challenge: "challenges/sigma-h"
    challenge_theorem: "challenge_sigmaH_main_frequency"
    source: "Kriventsov–Weiss, Theorem 7.2 (3)."
    statement: >-
      Under the hypotheses of Theorem 7.2 on the unit ball, N_x(u; 0+) = 1 at ℋ^{n-1}-almost
      every x ∈ Σ^H.

  - id: "classical-compactness"
    title: "Compactness of classical solutions (Theorem 9.3 = Theorem 1.3)"
    kind: "headline-theorem"
    lean_name: "InnerVariational.Statements.classical_compactness"
    lean_file: "InnerVariational/Statements/Applications.lean"
    challenge: "challenges/classical-compactness"
    challenge_theorem: "challenge_classical_compactness"
    source: "Kriventsov–Weiss, Theorem 9.3 (= Theorem 1.3)."
    statement: >-
      Let n ≥ 2 and let u_k be classical solutions of the Bernoulli problem on B₁ with
      |u_k| ≤ C and u_k C-Lipschitz on B₁. Then along a subsequence u_k → u locally uniformly in
      B₁, where u is C-Lipschitz and (u, χ_{u>0}) is a variational solution on B₁ with constant
      C; α(n)√(H_x(u;0+)) ≤ 1 at ℋ^{n-1}-a.e. x ∈ Σ^H; either u ≡ 0 or χ_{u_k>0} → χ_{u>0} in
      L¹_loc(B₁) and ∂{u_k>0} → ∂{u>0} locally in the Hausdorff sense; and B₁ ∩ ∂{u>0} is
      countably ℋ^{n-1}-rectifiable with locally finite measure, with the Laplacian formula of
      Theorem 8.7. The paper's hypothesis on ‖∇u_k‖_{C^{0,1}} is read as a bound on
      ‖u_k‖_{C^{0,1}(B₁)}.

  - id: "sperner"
    title: "Sperner's inequality for homogeneous harmonic functions, with the equality case"
    kind: "technical-input"
    lean_name: "Sperner.sperner_half_volume"
    lean_file: "Sperner/Main.lean"
    challenge: "challenges/sperner"
    challenge_theorem: "challenge_sperner_half_volume"
    source: >-
      E. Sperner, Jr., Zur Symmetrisierung von Funktionen auf Sphären, Math. Z. 134 (1973),
      317–327; used in the proofs of Lemmas 8.1 and 8.3 of Kriventsov–Weiss.
    statement: >-
      Let n ≥ 2 and let u ≥ 0 be Lipschitz and 1-homogeneous on ℝⁿ, harmonic on a connected
      component U of {u > 0}. Then |U ∩ B₁| ≥ |B₁|/2, and equality holds only if U is a
      half-space {y·e > 0} and u = a (y·e) on U for some unit vector e and a > 0.

  - id: "model-cases"
    title: "Model solutions (non-vacuity check)"
    kind: "sanity-check"
    challenge: "challenges/model-cases"
    challenge_theorem: "challenge_model_cases"
    source: "The one-dimensional solutions of Kriventsov–Weiss §3.1, extended to ℝⁿ."
    statement: >-
      (y_n)⁺ and |y_n|, each with χ = χ_{u>0}, are variational solutions on ℝⁿ with constant 1;
      0 ∉ Σ^H for (y_n)⁺ and 0 ∈ Σ^H for |y_n|; and H_0(α(n)|y_n|; r) = 1 for every r > 0.
      This guards against vacuous definitions; it is not a theorem of the paper.

  - id: "sigma-h-density-lipschitz"
    title: "Density characterization of Σ^H, Lipschitz coefficient"
    kind: "headline-theorem"
    lean_name: "InnerVariational.IsVariationalSolutionQ.mem_sigmaHQ_iff_frontier_inter"
    lean_file: "InnerVariational/Statements/LipschitzQ.lean"
    challenge: "challenges/lipschitz-q"
    challenge_theorem: "challenge_sigmaHQ_density"
    source: >-
      Kriventsov–Weiss, Section 6 and Proposition 3.5 (the form of Σ^H in the introduction),
      extended to a Lipschitz coefficient.
    statement: >-
      Let (u, χ) be a variational solution on Ω for the functional ∫ (|∇u|² + Q² χ), where Q is
      Lipschitz on Ω with 0 < c ≤ Q ≤ C'. Then x ∈ Σ^H if and only if x ∈ Ω lies on the
      relative free boundary ∂{y ∈ Ω : u(y) > 0} and |{χ = 1} ∩ B_r(x)| / |B_r(x)| → 1 as
      r → 0+. Here Σ^H = {x ∈ Ω ∩ closure {u > 0} : M^{Q(x)}_x(u; 0+) ≥ Q(x)² |B₁|}, with the
      Weiss energy M^q computed with the coefficient frozen at q.

  - id: "sigma-h-closed-lipschitz"
    title: "Σ^H is relatively closed, Lipschitz coefficient"
    kind: "headline-theorem"
    lean_name: "InnerVariational.IsVariationalSolutionQ.closure_sigmaHQ_inter_subset"
    lean_file: "InnerVariational/Statements/LipschitzQ.lean"
    challenge: "challenges/lipschitz-q"
    challenge_theorem: "challenge_sigmaHQ_closed"
    source: "Kriventsov–Weiss, Section 6, extended to a Lipschitz coefficient."
    statement: >-
      Under the same hypotheses, closure(Σ^H) ∩ Ω ⊆ Σ^H.

  - id: "viscosity-lipschitz"
    title: "Viscosity property off Σ^H, Lipschitz coefficient (Lemma 8.3)"
    kind: "headline-theorem"
    lean_name: "InnerVariational.IsVariationalSolutionQ.isViscositySolutionQ_diff_sigmaHQ"
    lean_file: "InnerVariational/Statements/LipschitzQ.lean"
    challenge: "challenges/lipschitz-q"
    challenge_theorem: "challenge_viscosityQ"
    source: "Kriventsov–Weiss, Lemma 8.3, extended to a Lipschitz coefficient."
    statement: >-
      Let n ≥ 2. Under the same hypotheses, u is a viscosity solution of Δu = 0 in {u > 0},
      |∇u| = Q on ∂{u > 0}, in the open set Ω \ Σ^H.

  - id: "blowup-limit-lipschitz"
    title: "Blow-up limits, Lipschitz coefficient"
    kind: "headline-theorem"
    lean_name: "InnerVariational.IsVariationalSolutionQ.exists_blowup_limit"
    lean_file: "InnerVariational/Statements/LipschitzQ.lean"
    challenge: "challenges/lipschitz-q"
    challenge_theorem: "challenge_blowup_limitQ"
    source: >-
      Kriventsov–Weiss, the rescaling (3.6) and the first paragraph of the proof of Theorem 9.3,
      extended to a Lipschitz coefficient.
    statement: >-
      Under the same hypotheses, let x ∈ Ω and r_k → 0+ with u(x + r_k ·)/r_k → u₀ locally
      uniformly on ℝⁿ. Then along a subsequence χ(x + r_k ·) → χ₀ in L¹_loc(ℝⁿ), where (u₀, χ₀)
      is a variational solution on ℝⁿ for the constant coefficient Q(x), with the same gradient
      constant.

  - id: "blowup-homogeneous-lipschitz"
    title: "Homogeneity of blow-up limits, Lipschitz coefficient"
    kind: "headline-theorem"
    lean_name: "InnerVariational.IsVariationalSolutionQ.blowup_homogeneous"
    lean_file: "InnerVariational/Statements/LipschitzQ.lean"
    challenge: "challenges/lipschitz-q"
    challenge_theorem: "challenge_blowup_homogeneousQ"
    source: "Kriventsov–Weiss, Proposition 3.4 (last claim), extended to a Lipschitz coefficient."
    statement: >-
      Under the hypotheses of the blow-up limit theorem, u₀(t y) = t u₀(y) for all t > 0 and
      y ∈ ℝⁿ.

  - id: "chi-identification-lipschitz"
    title: "Identification of χ, Lipschitz coefficient (Theorem 8.6)"
    kind: "headline-theorem"
    lean_name: "InnerVariational.Singular.chi_eq_indicator_of_localQ"
    lean_file: "InnerVariational/Statements/LipschitzQ.lean"
    challenge: "challenges/lipschitz-q"
    challenge_theorem: "challenge_chi_eq_indicatorQ"
    source: "Kriventsov–Weiss, Theorem 8.6, extended to a Lipschitz coefficient."
    statement: >-
      Let n ≥ 2 and let U ⊆ ℝⁿ be connected. Suppose every point of U has an open neighbourhood
      V ⊆ U on which (u, χ) is a variational solution for the coefficient Q, with Q Lipschitz on
      V and 0 < c ≤ Q ≤ C' there. Then either u ≡ 0 on U and χ = 1 a.e. on U, or χ = χ_{u>0}
      a.e. on U.

comparator:
  external_challenges:
    directory: "challenges"
    purpose: >-
      Standalone comparator challenge workspaces. Statement.lean and Challenge.lean import
      Mathlib only; Solution.lean imports InnerVariational (or Sperner) and proves the same
      statements.
    toolchain: "leanprover/lean4:v4.34.1"
    mathlib: "v4.34.1"
    permitted_axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_revision: "575674928e239f5bc452aab72d1dd7b0f1326494"
    lean4export_revision: "076e8e57707e813375e8f9da8bf989799ace9680"
    landrun_revision: "811cfff51ceaf3d9843708aa6d22e9b84ccac8b4"
    entries:
      - id: "main-theorem"
        path: "challenges/main-theorem"
        theorem_names:
          - "challenge_main_theorem"
          - "challenge_chi_eq_indicator"
          - "challenge_laplacian_measure_eq"
        checks: >-
          Theorems 1.2, 8.6 and 8.7 with the variational-solution notion, Σ^H, the reduced
          boundary, rectifiability and the Laplacian measure all written out in Mathlib
          vocabulary.
      - id: "sigma-h"
        path: "challenges/sigma-h"
        theorem_names:
          - "challenge_sigmaH_main"
          - "challenge_sigmaH_main_frequency"
        checks: "Theorem 7.2 (1)–(3) in Mathlib vocabulary."
      - id: "classical-compactness"
        path: "challenges/classical-compactness"
        theorem_names:
          - "challenge_classical_compactness"
        checks: "Theorem 9.3 = 1.3, with the classical-solution notion inlined."
      - id: "sperner"
        path: "challenges/sperner"
        theorem_names:
          - "challenge_sperner_half_volume"
        checks: "Sperner's inequality with the equality case (the library is Mathlib-only)."
      - id: "model-cases"
        path: "challenges/model-cases"
        theorem_names:
          - "challenge_model_cases"
        checks: >-
          Sanity check, not coverage: the model solutions satisfy the challenge definitions and
          Σ^H separates them.
      - id: "lipschitz-q"
        path: "challenges/lipschitz-q"
        theorem_names:
          - "challenge_sigmaHQ_density"
          - "challenge_sigmaHQ_closed"
          - "challenge_viscosityQ"
          - "challenge_blowup_limitQ"
          - "challenge_blowup_homogeneousQ"
          - "challenge_chi_eq_indicatorQ"
        checks: >-
          The results proved for a Lipschitz coefficient Q (Σ^H, the viscosity property, blow-up
          limits and their homogeneity, the identification of χ), with variational and viscosity
          solutions for Q and the frozen-coefficient Weiss energy written out in Mathlib
          vocabulary.

ci:
  workflow: ".github/workflows/ci.yml"
  expected_check: >-
    lake build --wfail (InnerVariational and Sperner), proof-integrity scan, file-size limit,
    module check, manifest lean-name and exact axiom check, challenge hygiene, and challenge
    elaboration
  release_workflow: ".github/workflows/release-comparator.yml"
  release_check: >-
    actual comparator execution over every challenge config, with attestation artifact; required
    before any tag or GitHub release
